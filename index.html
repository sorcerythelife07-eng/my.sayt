
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Lamp — Boshqaruv</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(145deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 24px;
      text-align: center;
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 20px 60px #0005;
    }

    h1 { margin: 0 0 8px; font-size: 27px; }
    .subtitle { color: #94a3b8; margin-bottom: 22px; }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 30px;
      background: #334155;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .connected .dot {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .lamp-area {
      margin: 26px 0;
      padding: 25px 10px;
      border-radius: 20px;
      background: #0f172a;
    }

    .bulb {
      font-size: 100px;
      line-height: 1.3;
      filter: grayscale(1);
      opacity: 0.35;
      transition: all 0.35s ease;
    }

    .bulb.on {
      filter: grayscale(0);
      opacity: 1;
      text-shadow: 0 0 20px #facc15, 0 0 55px #f59e0b;
    }

    .lamp-state {
      font-size: 25px;
      font-weight: bold;
      margin-top: 10px;
    }

    .state-description {
      color: #94a3b8;
      margin-top: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .on-btn { background: #16a34a; }
    .off-btn { background: #dc2626; }

    .log {
      margin-top: 24px;
      text-align: left;
      padding: 14px;
      border-radius: 12px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .log-title { font-weight: bold; margin-bottom: 8px; }
    #messages { max-height: 110px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Smart Lamp</h1>
    <div class="subtitle">Masofadan boshqarish paneli</div>

    <div class="connection" id="connection">
      <span class="dot"></span>
      <span id="connectionText">Ulanmoqda...</span>
    </div>

    <section class="lamp-area">
      <div class="bulb" id="bulb">💡</div>
      <div class="lamp-state" id="lampState">HOLAT NOMA'LUM</div>
      <div class="state-description" id="description">
        Qurilma holati kutilmoqda
      </div>
    </section>

    <button class="on-btn" id="onBtn" disabled>
      ☀️ LAMPANI YOQISH
    </button>

    <button class="off-btn" id="offBtn" disabled>
      🌙 LAMPANI O‘CHIRISH
    </button>

    <section class="log">
      <div class="log-title">Aloqa xabarlari</div>
      <div id="messages">Sayt ishga tushdi.</div>
    </section>
  </main>

  <script>
    const HOST =
      "wss://m18ff663.ala.eu-central-1.emqxsl.com:8084/mqtt";

    // EMQX Cloud foydalanuvchi ma'lumotlarini kiriting
    const USERNAME = "espUser";
    const PASSWORD = "sorcery007";

    const COMMAND_TOPIC = "myproject_83921/command";
    const REPLY_TOPIC = "myproject_83921/reply";

    const connection = document.getElementById("connection");
    const connectionText = document.getElementById("connectionText");
    const bulb = document.getElementById("bulb");
    const lampState = document.getElementById("lampState");
    const description = document.getElementById("description");
    const onBtn = document.getElementById("onBtn");
    const offBtn = document.getElementById("offBtn");
    const messages = document.getElementById("messages");

    function log(text) {
      const time = new Date().toLocaleTimeString();
      messages.textContent += "\n[" + time + "] " + text;
      messages.scrollTop = messages.scrollHeight;
    }

    function setConnection(connected) {
      connection.classList.toggle("connected", connected);
      connectionText.textContent =
        connected ? "Brokerga ulangan" : "Aloqa uzilgan";
      onBtn.disabled = !connected;
      offBtn.disabled = !connected;
    }

    function setLampState(state) {
      const isOn = state === "ON";

      bulb.classList.toggle("on", isOn);
      lampState.textContent = isOn ? "ON — YOQILGAN" : "OFF — O‘CHIRILGAN";
      lampState.style.color = isOn ? "#facc15" : "#94a3b8";
      description.textContent = isOn
        ? "Lampa yoqilgan holatda"
        : "Lampa passiv holatda";
    }

    const client = mqtt.connect(HOST, {
      clientId: "web_" + Math.random().toString(16).slice(2, 12),
      username: USERNAME,
      password: PASSWORD,
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 3000,
      keepalive: 30
    });

    client.on("connect", function () {
      setConnection(true);
      log("MQTT brokeriga ulandi.");

      client.subscribe(REPLY_TOPIC, function (err) {
        if (err) {
          log("Javob mavzusiga obuna bo‘lishda xato.");
        } else {
          log("Qurilma holati kutilmoqda.");
        }
      });
    });

    client.on("offline", function () {
      setConnection(false);
      log("Aloqa uzildi.");
    });

    client.on("close", function () {
      setConnection(false);
    });

    client.on("reconnect", function () {
      connectionText.textContent = "Qayta ulanmoqda...";
    });

    client.on("error", function (err) {
      log("MQTT xatosi: " + err.message);
    });

    client.on("message", function (topic, payload) {
      const message = payload.toString().trim();
      log("ESP8266: " + message);

      if (message === "STATE:ON") {
        setLampState("ON");
      } else if (message === "STATE:OFF") {
        setLampState("OFF");
      }
    });

    function sendCommand(command) {
      if (!client.connected) {
        log("Brokerga ulanish mavjud emas.");
        return;
      }

      client.publish(COMMAND_TOPIC, command, function (err) {
        if (err) {
          log("Buyruq yuborilmadi.");
        } else {
          log("Buyruq yuborildi: " + command);
        }
      });
    }

    onBtn.addEventListener("click", function () {
      sendCommand("ON");
    });

    offBtn.addEventListener("click", function () {
      sendCommand("OFF");
    });
  </script>
</body>
</html>
